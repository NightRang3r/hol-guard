name: Regenerate native extension program

on:
  push:
    branches: [fix/main-native-extension-runtime]
    paths:
      - ".github/workflows/native-extension-regenerate-program.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Compile and verify native command program
        run: |
          uv run --no-sync python scripts/build_native_command_program.py
          uv run --no-sync python scripts/build_native_command_program.py --check
          git diff --check
          git status --short
      - name: Commit generated program only
        run: |
          test -n "$(git status --porcelain -- contracts/extensions/native-command-program.v1.json)"
          test "$(git status --porcelain | wc -l)" -eq 1
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add contracts/extensions/native-command-program.v1.json
          git commit -m "fix(extensions): regenerate native program for current main catalog"
          git push origin HEAD:fix/main-native-extension-runtime
