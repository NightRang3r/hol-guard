name: Temporary native program regeneration

on:
  push:
    branches:
      - fix/main-native-extension-runtime

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --no-sync python scripts/build_native_command_program.py
      - name: Commit exact generated artifact when stale
        run: |
          if git diff --quiet -- contracts/extensions/native-command-program.v1.json; then
            echo "Native command program already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/extensions/native-command-program.v1.json
          git commit -m "chore(extensions): regenerate native command program"
          git push origin HEAD:fix/main-native-extension-runtime
