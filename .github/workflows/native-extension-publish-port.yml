name: Reconstruct verified native extension implementation

on:
  push:
    branches: [fix/main-native-extension-runtime]
    paths: ['.github/workflows/native-extension-publish-port.yml']

permissions:
  contents: read

jobs:
  publish-owned-branch:
    if: github.repository == 'hashgraph-online/hol-guard' && github.ref == 'refs/heads/fix/main-native-extension-runtime' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - name: Prepare locked reference environment
        run: |
          uv sync --frozen --python 3.12
          git fetch --no-tags origin 05fa4760df8401b9710bf098adb4fbb2dc4ff389 590ce01334a7724f3f1349b2ab252110a5a268f5
          git merge-base --is-ancestor 05fa4760df8401b9710bf098adb4fbb2dc4ff389 "$GITHUB_SHA"
      - name: Reconstruct bounded verified source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          blobs = (
              '40a1c5c1f9c7e65014bd36f2a12d69e8b092eb16',
              'fc02f0f7361c59899fdfe5624cd9d19881a97440',
              'f6c8cb688f844abfc4992a898902266bd9082810',
              '9d28473925b6528e3a68b339ec624e6d9d016d2b',
              'b764bb97496cd4f7a7320480a15e96df58e8f8f5',
          )
          parts = []
          for sha in blobs:
              request = urllib.request.Request(
                  'https://api.github.com/repos/hashgraph-online/hol-guard/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  envelope = json.loads(response.read(32768))
              assert envelope['encoding'] == 'base64'
              data = base64.b64decode(envelope['content'].replace('\n', ''), validate=True)
              assert len(data) <= 6500
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data)
          compressed = base64.b64decode(b''.join(parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'd79b7266b7a88f5adc9080085578d8dd9204fbeb4ae66b04056aa65535068c7a'
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          raw = decoder.decompress(compressed, max_length=2 * 1024 * 1024)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(raw).hexdigest() == '12efa97dbe3b41e380fc36457f089180f6fdc01b7967ea0182c90b88a0640243'
          payload = json.loads(raw)
          assert payload['schema'] == 1
          assert payload['base'] == '05fa4760df8401b9710bf098adb4fbb2dc4ff389'
          assert payload['reference'] == '590ce01334a7724f3f1349b2ab252110a5a268f5'
          paths = payload['paths']
          assert paths == sorted(set(paths)) and len(paths) == 138
          assert set(payload['reference_paths']).issubset(paths)
          assert set(payload['modes']) == set(paths) and set(payload['modes'].values()) == {'100644'}
          for value in paths:
              path = pathlib.PurePosixPath(value)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'rust', 'src', 'scripts', 'tests', 'ci', 'contracts', 'docs', 'pyproject.toml'}
              assert value == path.as_posix()
              for parent in pathlib.Path(value).parents:
                  assert not parent.is_symlink()
              assert not pathlib.Path(value).is_symlink()
          for value in payload['reference_paths']:
              data = subprocess.check_output(['git', 'show', payload['reference'] + ':' + value])
              path = pathlib.Path(value)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              path.chmod(0o644)
          subprocess.run(['git', 'apply', '--check', '-'], input=payload['patch'].encode(), check=True)
          subprocess.run(['git', 'apply', '-'], input=payload['patch'].encode(), check=True)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'verified-native-port.json').write_bytes(raw)
          print('Reconstructed verified source patch; generated artifacts still require verification.')
          PY
      - name: Regenerate native program and independent oracle
        run: |
          uv run --no-sync python -c 'import sys,unicodedata; assert sys.version_info[:2] == (3,12); assert unicodedata.unidata_version == "15.0.0"'
          uv run --no-sync python scripts/build_native_command_program.py
          uv run --no-sync python scripts/generate_native_command_fixtures.py
      - name: Verify exact candidate bytes and publish without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          payload = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'verified-native-port.json').read_bytes())
          digest = hashlib.sha256()
          for value in payload['paths']:
              path = pathlib.Path(value)
              assert path.is_file() and not path.is_symlink()
              path.chmod(0o644)
              digest.update(value.encode() + b'\0' + path.read_bytes() + b'\0')
          assert digest.hexdigest() == payload['digest'] == '41d9b19aeb2845c2e6b6fcfa13d6b65ad6193b7953852d6d077b13ea67955821'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed.issubset(payload['paths'])
          subprocess.run(['git', 'add', '--', *payload['paths']], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert staged == set(payload['paths'])
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(extensions): enforce the complete current command catalog in Rust\n\nPreserve native authority, opt-in controls, safe-variant isolation, receipt identity and approval freshness. Include installed lifecycle probes.\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'], check=True)
          branch = 'refs/heads/fix/main-native-extension-runtime'
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', branch], text=True).split()[0]
          assert remote == os.environ['GITHUB_SHA'], 'Owned branch advanced; reconcile rather than overwrite.'
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          env = os.environ.copy()
          env.update({'GIT_CONFIG_COUNT': '1', 'GIT_CONFIG_KEY_0': 'http.https://github.com/.extraheader', 'GIT_CONFIG_VALUE_0': 'AUTHORIZATION: basic ' + auth})
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + branch], env=env, check=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate-source.sha').write_text(sha + '\n')
          subprocess.run(['git', 'archive', '--format=tar.gz', '--output=' + os.environ['RUNNER_TEMP'] + '/candidate-source.tar.gz', 'HEAD'], check=True)
          print('Published verified implementation:', sha, 'files:', len(staged), 'digest:', digest.hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-extension-published-source
          path: |
            ${{ runner.temp }}/candidate-source.sha
            ${{ runner.temp }}/candidate-source.tar.gz
          if-no-files-found: error
          retention-days: 3
